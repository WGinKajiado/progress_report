<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./styles.css" rel="stylesheet">
</head>

<body class="text-grey-600 bg-gray-200">
    <div><!-- content wrapper -->
        <div> <!-- navigation Edit report & Preview -->
            <nav> 
                <div class="p-5 bg-gray-50 shadow-md">
                    <div>
                        <h1 class="text-2xl"> <a href="/">Construction Progress Report Generator</a> </h1>
                        <h3 class="text-lg">  Weekly site progress documentation system </h3>
                    </div>

                    <!-- <div class="px-6 flex justify-end text-red-500">
                        <a href="#" class="text-primary">Log in</a>
                        <a href="#" class="text-primary ml-20">Sign up</a>
                    </div> -->
                </div>
            </nav> 
        </div> <!-- end nav -->
    </div> <!-- end content wrapper -->

    <main>

        <div class="min-h-screen flex justify-center items-center">

            <!-- Login Card -->
            <div id="logincard" class="bg-white shadow-xl rounded-xl p-10 outline outline-blue-300">
                <h2 class="text-3xl font-bold text-center text-blue-600 mb-6">Login</h2>

                    <form id="loginForm" class="flex flex-col space-y-4">

                        <div>
                            <label for="email" class="text-gray-600 font-medium">Email</label>
                                <input 
                                    id="email"
                                    type="email"
                                    class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
                                    placeholder="example@email.com"
                                    required
                                />
                        </div>

                        <div>
                            <label for="password" class="text-gray-600 font-medium">Password</label>
                            <input 
                                id="password"
                                type="password"
                                class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
                                placeholder="Enter password"
                                required
                            />
                        </div>

                        <!-- Error Message -->
                        <p id="loginError" class="text-red-500 text-sm text-center hidden">Invalid email or password</p>

                        <button 
                            type="submit" 
                            class="bg-blue-600 hover:bg-black text-white font-semibold rounded-lg p-3 transition"
                        >
                            Login
                        </button>

                        <p class="text-sm text-gray-600 text-center">
                            Don't have an account?
                            <a href="signup.html" class="text-blue-600 hover:underline">Sign up</a>
                        </p>

                    </form>
            </div> <!-- end of login card -->
        </div>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginError = document.getElementById("loginError");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const savedUser = JSON.parse(localStorage.getItem("user"));
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (savedUser && email === savedUser.email && password === savedUser.password) {
                loginError.classList.add("hidden");
                alert("Login successful!");
                window.location.href = "report.html"; // your dashboard page
            } else {
                loginError.classList.remove("hidden");
            }
        });
    </script>


</body>
</html>
