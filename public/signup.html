<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./styles.css" rel="stylesheet">
</head>

<body class="text-grey-600 bg-gray-200">
    <div><!-- content wrapper -->
        <div> <!-- navigation Edit report & Preview -->
            <nav> 
                <div class="p-5 bg-gray-50 shadow-md">
                    <div>
                        <h1 class="text-2xl"> <a href="/">Construction Progress Report Generator</a> </h1>
                        <h3 class="text-lg">  Weekly site progress documentation system </h3>
                    </div>

                    <!-- <div class="px-6 flex justify-end text-red-500">
                        <a href="#" class="text-primary">Log in</a>
                        <a href="#" class="text-primary ml-20">Sign up</a>
                    </div> -->
                </div>
            </nav> 
        </div> <!-- end nav -->
    </div> <!-- end content wrapper -->

    <main>

        <div class="min-h-screen flex justify-center items-center">

            <!-- Sign up Card -->
            <div id="signupCard" class="bg-white shadow-xl rounded-xl p-10  outline outline-blue-300">
                <h2 class="text-3xl font-bold text-center text-blue-600 mb-6">Sign Up</h2>

                    <form id="signupForm" class="flex flex-col space-y-4">

                        <div>
                            <label for="email" class="text-gray-600 font-medium">Email</label>
                                <input 
                                    id="email"
                                    type="email"
                                    class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
                                    placeholder="example@email.com"
                                    required
                                />
                        </div>

                        <div>
                            <label for="password" class="text-gray-600 font-medium">Password</label>
                            <input 
                                id="password"
                                type="password"
                                class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
                                placeholder="Enter password"
                                required
                            />
                        </div>

                        <div>
                            <label for="confirmPassword" class="text-gray-600 font-medium">Confirm Password</label>
                            <input 
                                id="confirmPassword"
                                type="password"
                                class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
                                placeholder="Confirm password"
                                required
                            />
                        </div>

                        <!-- Error Message -->
                        <p id="pserrorMsg" class="text-red-500 text-sm text-center hidden">Passwords do not match</p>

                        <button type="submit" class="bg-blue-600 hover:bg-black text-white font-semibold rounded-lg p-3 transition">
                            Sign up
                        </button>

                        <p class="text-sm text-gray-600 text-center">
                            <a href="index.html" class="text-blue-600 hover:underline"> <- Back to Login</a>
                        </p>

                    </form>
            </div> <!-- end of sign up card -->
        </div>

    </main>

    <script>
            const signupForm = document.getElementById("signupForm");
            const errorMsg = document.getElementById("pserrorMsg");

            signupForm.addEventListener
            (
                "submit", function(event) 
            {
                event.preventDefault();

                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;

                if (password !== confirmPassword) 
                {
                    errorMsg.classList.remove("hidden");
                    return;
                // } else {
                }

                // Save to localStorage
                const userData = 
                {
                    email: email,
                    password: password
                };

                localStorage.setItem("user", JSON.stringify(userData));

                errorMsg.classList.add("hidden");
                alert("Account created successfully!");

                // Redirect to login
                window.location.href = "index.html";
                
            });

    </script>

</body>
</html>
